[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oxbow-bundle"
version = "0.1.0rc1"
description = "Self-orienting AI handoffs that carry the work without claiming continuity of model instance."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["llm", "context", "handoff", "bundle", "provenance", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Packaging",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
oxbow = "oxbow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oxbow.bundle" = ["*.md"]
"oxbow.witness" = ["*.md", "schemas/*.json"]
